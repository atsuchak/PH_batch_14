<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github command</title>
</head>
<body>
    <h1>Git command</h1>

    <h3>Git initailize</h3>
    <p>git init</p>

    <h3>Git add</h3>
    <p>git add .</p>

    <h3>Git commit</h3>
    <p>git commit -m "mmeaningfull message"</p>

    <h3>Git push</h3>
    <p>git push -u origin main</p>

    <h3>Git remote</h3>
    <p>git remote add origin "git repo link"</p>
</body>
</html>
