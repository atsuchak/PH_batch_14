<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table</title>

    <style>
        table {
            border: 1px solid black;
            border-collapse: collapse;
            /* width: 100%; */
        }

        th, td {
            border: 1px solid black;
            padding: 3px 10px;
            /* text-align: left; */
        }

        th {
            background-color: #c9c9c9;
        }

        tfoot td {
            text-align: center;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <main>
        <h2>Table with borders and padding</h2>

        <table>
            <caption>Table Caption</caption>
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>John</td>
                    <td>Doe</td>
                    <td>30</td>
                </tr>

                <tr>
                    <td>Mary</td>
                    <td>Moe</td>
                    <td>25</td>
                </tr>

                <tr>
                    <td>July</td>
                    <td>Dooley</td>
                    <td>35</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Table Footer</td>
                </tr>
            </tfoot>
        </table>

        <ul>
            <li>table: table</li>
            <li>table head: thead</li>
            <li>table body: tbody</li>
            <li>table row: tr</li>
            <li>table data: td</li>
            <li>table heading: th</li>
            <li>table footer: tfooter</li>
        </ul>
    </main>
</body>
</html>
