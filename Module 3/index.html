<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tutorial</title>

    <style>
        p {
            color: purple;
        }

        h2 {
            color: red;
        }

        .fourth {
            color: green;
        }

        #aheading {
            color: orange;
        }
    </style>
</head>
<body>
    <p>This is a simple paragraph</p>
    <!-- inline style --> 
    <!-- <p style="color: red;">This is another simple paragraph</p> 
    <p style="color: green;">This is a third simple paragraph</p>   -->

    <p class="fourth">This is a fourth simple paragraph</p>
    <p>This is fifth simple paragraph</p>
    <p class="fourth">This is sixth simple paragraph</p>

    <h2>This is heading</h2>
    <h2>This is another heading</h2>
    <h2 id="aheading">This is once more another heading</h2>
    <h4>This is subheading</h4>

    <a href="www.google.com">Visit Google</a>
    <a href="www.github.com">Visit Github</a>
</body>
</html>
